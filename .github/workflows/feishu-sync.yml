name: Feishu CRM sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Feishu mail sheet into CRM
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aibubu-feishu-sync"
          )"
          oidc_token="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' \
              <<<"${token_response}"
          )"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${oidc_token}" \
            "https://www.lsjffdwg.cn/api/feishu-mail-sync/run"
